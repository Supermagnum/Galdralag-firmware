[package]
name = "cipher-profile"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Named cipher profiles: ECDHE curve, symmetric cascade, Shamir metadata"

[dependencies]
cess = { path = "../cess" }
galdr-core = { path = "../galdr-core" }
galdr-vault = { path = "../vault" }
ephemeral-session = { path = "../ephemeral-session" }
hkdf = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
heapless = { workspace = true }
aes-gcm = { workspace = true }
aead = { workspace = true }
chacha20poly1305 = { workspace = true }

[features]
default = []
kat-gen = ["dep:serde_json", "dep:hex"]

[dependencies.serde_json]
workspace = true
optional = true

[dependencies.hex]
workspace = true
optional = true

[[bin]]
name = "cascade-kat-gen"
path = "src/bin/cascade_kat_gen.rs"
required-features = ["kat-gen"]

[dev-dependencies]
galdr-core = { path = "../galdr-core", features = ["test-hal"] }
ephemeral-session = { path = "../ephemeral-session" }
galdr-vault = { path = "../vault" }
hex = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
