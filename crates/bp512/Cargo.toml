[package]
name = "bp512"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Brainpool P-512r1 (in-tree). Field/scalar math via primefield crypto-bigint backend."
repository = "https://github.com/RustCrypto/elliptic-curves"
publish = false

[features]
alloc = [
    "ecdsa?/alloc",
    "elliptic-curve/alloc",
    "primeorder?/alloc",
]
arithmetic = ["dep:primefield", "dep:primeorder"]
bits = ["arithmetic", "elliptic-curve/bits"]
default = ["pkcs8"]
getrandom = ["ecdsa?/getrandom", "elliptic-curve/getrandom"]
pkcs8 = ["ecdsa/pkcs8", "elliptic-curve/pkcs8"]
serde = ["ecdsa/serde", "elliptic-curve/serde"]
sha512 = ["ecdsa/digest", "ecdsa/hazmat", "sha2"]
std = ["alloc", "ecdsa?/std", "elliptic-curve/std", "getrandom"]

[dependencies]
ecdsa = { version = "0.17.0-rc.16", optional = true, default-features = false, features = ["der"] }
elliptic-curve = { version = "0.14.0-rc.29", default-features = false, features = ["sec1"] }
primefield = { version = "0.14.0-rc.8", optional = true }
primeorder = { version = "0.14.0-rc.8", optional = true }
sha2 = { version = "0.11.0-rc.5", optional = true, default-features = false }
