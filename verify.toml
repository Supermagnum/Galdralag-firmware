# crypto-verify: trust anchors and expected hashes for Galdralag-firmware.
# After editing, refresh the detached signature:
#   gpg --armor --detach-sign --output verify.toml.asc verify.toml

# OpenPGP v4 fingerprint of the maintainer key that must sign verify.toml (40 hex digits, no spaces).
maintainer_fingerprint = "55FDF48EB398011D5C35E3CE4F21DEAD0DE9024E"

# TOML vector bundles: SHA-256 and Shamir (crypto-verify primitive runners only).
# Root vectors align with NIST short-msg samples and vault Shamir reference tests.
primitive_vectors = [
  "vectors/sha256.toml",
  "vectors/shamir.toml",
]

