# GitHub Actions: host test suite + dependency audit.
#
# PR/push to main: test-all (--no-fuzz; dudect on), cargo-audit (three
# lockfiles), firmware-check (riscv32 galdr-vault + check-fw).
# galdralag workspace compile is deferred (no public xous-core branch);
# lockfile still audited.
#
# Cargo-fuzz is **not** a CI job (needs nightly + long wall time). Run locally:
#   cargo run -p xtask -- test-all
#   cargo run -p xtask -- fuzz <target>
#
# cargo audit --file does not need xous-core. services/galdralag Cargo.toml
# path-depends on ./xous-core. The README branch
# `feature/usb-bao1x-ccid-openpgp` is **not** on public betrusted-io/xous-core
# (only `main`/`dev` exist). CI therefore does **not** clone xous-core and
# does **not** `cargo check` the galdralag workspace. The galdralag
# **lockfile is still audited** in the cargo-audit job. Local image builds
# keep using `ln -sfn ../xous-core ./xous-core`.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-all:
    name: test-all
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpcsclite-dev \
            libssl-dev \
            libgtk-4-dev
      - name: test-all --no-fuzz
        run: cargo run -p xtask -- test-all --no-fuzz

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Three lockfiles, separately. Ignores only from .cargo/audit.toml
      # (documented in docs/THREAT_MODEL.md). Informational warnings do not fail.
      - name: Audit root Cargo.lock
        run: cargo audit --file Cargo.lock
      - name: Audit services/galdralag/Cargo.lock
        run: cargo audit --file services/galdralag/Cargo.lock
      - name: Audit fuzz/Cargo.lock
        run: cargo audit --file fuzz/Cargo.lock

  firmware-check:
    name: firmware-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo check galdr-vault (riscv32imac-unknown-none-elf)
        run: cargo check -p galdr-vault --target riscv32imac-unknown-none-elf
      - name: check-fw (default)
        run: cargo run -p xtask -- check-fw
      - name: check-fw (pq-signatures)
        run: cargo run -p xtask -- check-fw --features pq-signatures
