[workspace]
resolver = "2"
members = [
    "crates/biometric-api",
    "crates/biometric-vault",
    "crates/biometric-fingervein",
    "crates/biometric-sweet",
    "crates/cess",
    "crates/contact-store",
    "crates/galdr-core",
    "crates/vault",
    "crates/ephemeral-session",
    "crates/cipher-profile",
    "crates/pin-policy",
    "crates/usb-personality",
    "crates/host-tools",
    "crates/security-tests",
    "services/galdralag-stub",
    "xtask",
    "galdra-core-host",
    "galdra",
    "galdrad",
    "galdra-gtk",
]

# `galdralag-service` is built via `--manifest-path` (see `services/galdralag/README.md`): it pulls
# path `pddb` + `bao1x-hal` from `xous-core` and cannot share the host workspace lockfile without an
# `svd2utra` / `loader` resolve clash.
exclude = ["crates/baochip-openpgp", "services/galdralag"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
galdr-core = { path = "crates/galdr-core" }
galdr-vault = { path = "crates/vault" }
ephemeral-session = { path = "crates/ephemeral-session" }
cipher-profile = { path = "crates/cipher-profile" }
cess = { path = "crates/cess" }
contact-store = { path = "crates/contact-store" }
pin-policy = { path = "crates/pin-policy" }
usb-personality = { path = "crates/usb-personality" }
biometric-api = { path = "crates/biometric-api" }
biometric-vault = { path = "crates/biometric-vault" }
cbor4ii = { version = "1.2", default-features = false, features = ["serde1", "use_alloc"] }

aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aead = { version = "0.5", default-features = false }
bp256 = { version = "0.14.0-rc.8", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "sha256"] }
bp384 = { version = "0.14.0-rc.8", default-features = false, features = ["arithmetic", "ecdsa", "sha384", "pkcs8"] }
# Enables `elliptic_curve::ecdh` for vault ECDH (must match bp256's elliptic-curve version).
elliptic-curve = { version = "0.14.0-rc.29", default-features = false, features = ["ecdh", "sec1", "pkcs8"] }
ecdsa = { version = "0.17.0-rc.16", default-features = false, features = ["digest", "der", "algorithm"] }
ff = { version = "0.13", default-features = false }
heapless = { version = "0.8", default-features = false }
usb-device = { version = "0.3.2", default-features = false }
signature = { version = "3.0.0-rc.10", default-features = false, features = ["digest"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
hkdf = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.11", default-features = false }
blake2 = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false }
bitflags = { version = "2.11", default-features = false }
crc32fast = { version = "1.4", default-features = false }
vsss-rs = { version = "5.3", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
subtle = { version = "2.6", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", default-features = false }
rand = { version = "0.8.8", default-features = false, features = ["std_rng", "getrandom"] }
proptest = "1.5"
static_assertions = "1.1"
hex = { version = "0.4", default-features = false, features = ["std"] }
camellia = { version = "0.2.0", default-features = false, features = ["zeroize"] }
serpent = { version = "0.6.0-rc.3", default-features = false, features = ["zeroize"] }
twofish = { version = "0.8.0-rc.1", default-features = false }
rsa = { version = "0.9.10", default-features = false, features = ["sha2"] }

# Galdra host tool (pinned; run `cargo audit` after changes)
clap = { version = "4.5.28", features = ["derive"] }
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher"] }
sequoia-openpgp = { version = "2.4.1", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "compression", "allow-variable-time-crypto"] }
sequoia-net = { version = "0.30.1", default-features = false }
rusb = "0.9.4"
rpassword = "7.3.1"
serialport = { version = "4.6.0", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
toml = "0.8.19"
uuid = { version = "1.11.0", features = ["v4"] }
chrono = { version = "0.4.39", features = ["serde"] }
thiserror = "1.0.69"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
axum = "0.7.9"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.95"
utoipa = { version = "5.2.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8.0.3", features = ["axum"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace"] }
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
ldap3 = "0.11.5"
image = "0.25.5"
rqrr = "0.10.1"
age = "0.10.0"
assert_cmd = "2.0.16"
predicates = "3.1.3"
pcsc = "2.8"
gtk = { version = "0.9.5", package = "gtk4" }
libadwaita = "0.7.1"

[patch.crates-io]
subtle = { path = "crates/subtle-vendored" }

[workspace.lints.rust]
unsafe_code = "forbid"
