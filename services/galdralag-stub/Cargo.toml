[package]
name = "galdralag-stub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal Xous CCID APDU stub for dabao-ccid bring-up (ATR + SELECT)"

[[bin]]
name = "galdralag-stub"
path = "src/main.rs"

[dependencies]
log = "0.4.14"
usb-personality.workspace = true

[target.'cfg(target_os = "xous")'.dependencies]
ticktimer = { package = "xous-api-ticktimer", version = "0.9.70" }
xous = "0.9.70"
xous-ipc = "0.10.10"
xous-names = { package = "xous-api-names", version = "0.9.71" }
log-server = { package = "xous-api-log", version = "0.1.69" }
rkyv = { version = "0.8.8", default-features = false, features = ["std", "alloc"] }

[lints]
workspace = true
