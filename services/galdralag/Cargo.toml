[package]
name = "galdralag-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "galdralag_service"
path = "src/lib.rs"

[[bin]]
name = "galdralag-service"
path = "src/main.rs"
required-features = ["xous-bsp"]

[features]
default = []
# Enable the real Xous CCID daemon. Pair with exactly one board feature
# (`board-baosec` or `board-dabao`). `xtask build-galdralag-xous` passes both
# `xous-bsp` and `board-baosec`.
xous-bsp = []
# Forward HAL board selection into path crates (do not hard-wire on deps).
board-baosec = [
    "baochip-openpgp/board-baosec",
    "bao1x-hal/board-baosec",
]
board-dabao = [
    "baochip-openpgp/board-dabao",
    "bao1x-hal/board-dabao",
]
# Deliberate opt-in for MMIO firmware-update reboot (see `reboot::UpdateModeAuthorization`).
privileged-reboot = []

[dependencies]
galdr-core = { path = "../../crates/galdr-core" }
log = "0.4.14"

[target.'cfg(target_os = "xous")'.dependencies]
baochip-openpgp = { path = "../../crates/baochip-openpgp" }
bao1x-hal = { path = "../../xous-core/libs/bao1x-hal", features = ["std"] }
galdr-vault = { path = "../../crates/vault" }
heapless = "0.8"
ticktimer = { package = "xous-api-ticktimer", version = "0.9.70" }
usb-personality = { path = "../../crates/usb-personality" }
xous = "0.9.70"
xous-ipc = "0.10.10"
xous-names = { package = "xous-api-names", version = "0.9.71" }
log-server = { package = "xous-api-log", version = "0.1.69" }
pddb = { path = "../../xous-core/services/pddb", default-features = false, features = ["mbbb"] }
rkyv = { version = "0.8.8", default-features = false, features = ["std", "alloc"] }
trng = { path = "../../xous-core/services/trng" }

[dev-dependencies]
galdr-core = { path = "../../crates/galdr-core", features = ["test-hal"] }

[lints.rust]
unsafe_code = "allow"

# This crate is its own workspace root when built via `--manifest-path` so `[patch.crates-io]` applies.
[workspace]

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/betrusted-io/curve25519-dalek.git", branch = "main" }
svd2utra = { path = "../../xous-core/svd2utra" }
