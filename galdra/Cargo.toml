[package]
name = "galdra"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Galdra command-line interface"

[features]
default = ["pcsc"]
pcsc = ["galdra-core-host/pcsc"]

[[bin]]
name = "galdra"
path = "src/main.rs"

[dependencies]
galdra-core-host = { path = "../galdra-core-host", default-features = false }
sequoia-openpgp = { workspace = true }
clap = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
tokio = { workspace = true }
image = { workspace = true }
rqrr = { workspace = true }
age = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
sequoia-openpgp = { workspace = true }
tempfile = "3.14.0"

[lints.rust]
unsafe_code = "forbid"
