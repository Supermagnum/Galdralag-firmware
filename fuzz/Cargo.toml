[package]
name = "vault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
galdr-core = { path = "../crates/galdr-core", features = ["test-hal"] }
rand_core = { version = "0.6", default-features = false }
vault = { path = "../crates/vault" }
ephemeral-session = { path = "../crates/ephemeral-session" }
cipher-profile = { path = "../crates/cipher-profile" }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
biometric-api = { path = "../crates/biometric-api" }
pin-policy = { path = "../crates/pin-policy" }
usb-personality = { path = "../crates/usb-personality" }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }

[[bin]]
name = "biometric_dispatch"
path = "fuzz_targets/biometric_dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chacha_roundtrip"
path = "fuzz_targets/chacha_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shamir_split_recover"
path = "fuzz_targets/shamir_split_recover.rs"
test = false
doc = false
bench = false

