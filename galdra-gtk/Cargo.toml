[package]
name = "galdra-gtk"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "GTK4 desktop client for Galdra (galdrad HTTP API)"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
gtk = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
