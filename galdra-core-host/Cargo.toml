[package]
name = "galdra-core-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Host-side business logic for the Galdra token management tool"

[dependencies]
anyhow = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
chrono = { workspace = true }
cipher-profile = { path = "../crates/cipher-profile" }
cess = { path = "../crates/cess" }
heapless = { workspace = true }
ephemeral-session = { path = "../crates/ephemeral-session" }
galdr-core = { path = "../crates/galdr-core", features = ["test-hal"] }
hex = { workspace = true }
ldap3 = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sequoia-net = { workspace = true }
sequoia-openpgp = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
vault = { path = "../crates/vault" }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.14.0"

[lints.rust]
unsafe_code = "forbid"
